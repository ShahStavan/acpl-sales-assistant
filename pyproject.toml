[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project
# ---------------------------------------------------------------------------
[project]
name = "acpl-assistant"
version = "0.1.0"
description = "ACPL Sales Focus & Action Assistant: grounded /ask and playbook-driven /actions over FY26 sales data"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["fastapi", "duckdb", "llm", "sales-analytics", "grounded-qa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Topic :: Office/Business",
  "Private :: Do Not Upload",
]

# Runtime dependencies. Keep in sync with requirements.txt (kept for the brief's
# `pip install -r requirements.txt` convention; pyproject is the source of truth).
dependencies = [
  # service
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  # data preparation & query
  "pandas>=2.2.0",
  "duckdb>=1.1.0",
  "openpyxl>=3.1.0",        # action_playbook.xlsx
  "python-docx>=1.1.0",     # documents/*.docx
  # entity resolution / reconciliation
  "rapidfuzz>=3.10.0",
  # LLM provider (own key at runtime; see .env.example)
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  # evaluation set is YAML
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0.0",
]

[project.scripts]
acpl-prepare = "acpl_assistant.prepare.cli:main"
acpl-serve = "acpl_assistant.service:main"

[project.urls]
Approach = "https://github.com/ShahStavan/acpl-sales-assistant/blob/main/APPROACH.md"
Design = "https://github.com/ShahStavan/acpl-sales-assistant/blob/main/DESIGN.md"

# ---------------------------------------------------------------------------
# Build (src layout)
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acpl_assistant = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"
src = ["src", "tests", "eval"]
extend-exclude = [
  "data",        # provided data pack: never touched by tooling
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "D",          # pydocstyle
  "UP",         # pyupgrade
  "B",          # flake8-bugbear
  "A",          # flake8-builtins
  "C4",         # flake8-comprehensions
  "DTZ",        # flake8-datetimez (naive datetimes)
  "T20",        # flake8-print
  "SIM",        # flake8-simplify
  "PTH",        # flake8-use-pathlib
  "PL",         # pylint
  "RET",        # flake8-return
  "ARG",        # flake8-unused-arguments
  "PERF",       # perflint
  "S",          # flake8-bandit
  "RUF",        # ruff-specific
]
ignore = [
  "D105",       # magic-method docstrings
  "D107",       # __init__ docstrings (documented on the class)
  "PLR0913",    # too many arguments: pipeline stages take explicit params
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode: en-dash and × are intentional in prose
  "S104",       # binding 0.0.0.0 is required inside the container
]
# Rules the formatter owns; disabled to avoid conflicts.
extend-ignore = ["E111", "E114", "E117", "E501", "W191"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",       # assert is the test idiom
  "S106",       # hard-coded test credentials
  "PLR2004",    # magic values in assertions
  "D",          # tests are documented by their names
  "ARG",        # fixtures are injected by name
  "RUF012",     # fixture rows as class attributes: read-only test data, not shared state
  "SLF001",     # tests reach for private helpers deliberately
]
"eval/**" = ["T201", "PLR2004"]                  # runner prints its report
"prepare.py" = ["T201"]                          # thin CLI shim
"src/acpl_assistant/prepare/cli.py" = ["T201"]   # progress output is the interface
"src/acpl_assistant/ask/intents.py" = ["S608"]   # parameterised SQL built from a fixed catalogue
# Same shape: the only values interpolated are the numeric playbook thresholds defined at the
# top of the module.  Every value that comes from a caller is bound as a query parameter.
"src/acpl_assistant/actions/rules.py" = ["S608"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["acpl_assistant"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

# ---------------------------------------------------------------------------
# Tests & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers --strict-config"
markers = [
  "integration: exercises the prepared warehouse or the HTTP app (deselect with -m 'not integration')",
  "llm: requires a live LLM key; skipped when LLM_API_KEY is unset",
]
filterwarnings = ["error::DeprecationWarning:acpl_assistant.*"]

[tool.coverage.run]
source = ["acpl_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
